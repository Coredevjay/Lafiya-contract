name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shell-lint:
    name: Shell lint (smoke-test.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Syntax check (bash -n)
        run: |
          bash -n scripts/smoke-test.sh
          bash -n scripts/smoke-test.test.sh
      - name: ShellCheck
        run: shellcheck scripts/smoke-test.sh scripts/smoke-test.test.sh
      - name: Run smoke-test.sh regression test
        run: bash scripts/smoke-test.test.sh

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --all-features --locked

  build-wasm:
    name: Build (wasm32v1-none)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      # Only the Soroban contract crates target wasm32v1-none; the other
      # workspace members (lafiya-cli, lafiya-config, lafiya-commitment) are
      # std binaries/libs that can't build for this no_std-only target.
      - name: Build contract crates
        run: cargo build --release --locked --target wasm32v1-none -p multisig-account -p attester-registry -p attestation-registry
      - name: Check README contract tables
        run: python .github/scripts/check_readme_contracts.py

  events-package:
    name: Events package (@lafiya/events)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/events
    steps:
      - uses: actions/checkout@v7
      # A new or changed contract event updates the interface snapshot
      # (enforced by `make conformance`); this fails if the TypeScript
      # decoders were not regenerated from it.
      - name: Check generated decoders are up to date
        run: python3 scripts/conformance/gen_events_ts.py --check
        working-directory: .
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test

  verifier-sdk:
    name: Verifier SDK (@lafiya/verifier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/verifier-sdk
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm run size

  indexer:
    name: Indexer (Postgres tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Restart/resume, retention-gap, backfill, and API tests.
      - run: cargo test -p lafiya-indexer --locked
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  fuzz:
    name: Fuzz (proptest, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked fuzz_test -- --nocapture
        env:
          PROPTEST_CASES: 256
