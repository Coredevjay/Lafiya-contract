[package]
name = "lafiya-cli"
version = "0.1.0"
edition = "2021"
description = "Lafiya admin CLI - interacts with Soroban contracts using config/networks.toml"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[[bin]]
name = "lafiya-cli"
path = "src/main.rs"

[dependencies]
lafiya-config = { path = "../lafiya-config" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
anyhow = "1.0"
lafiya-rpc-resilience = { path = "../lafiya-rpc-resilience", features = ["xdr"] }
stellar-xdr = { version = "27.0.0", default-features = false, features = ["std", "base64"] }
ureq = { version = "2.12", features = ["json"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3.10"
