[package]
name = "lafiya-rpc-resilience"
version = "0.1.0"
edition = "2021"
description = "Prototype: multi-provider RPC failover, retry classification, and transaction-recovery polling for Soroban submissions (ADR-0011)"
license = "MIT"
repository = "https://github.com/Lafiya-xyz/Lafiya-contract"

[dependencies]
stellar-xdr = { version = "27.0.0", default-features = false, features = ["std", "base64"], optional = true }

[features]
# Ledger-bound helpers for real transaction envelopes (issue #407). Off by
# default so the state machine stays dependency-free.
xdr = ["dep:stellar-xdr"]
